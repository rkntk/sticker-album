<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Альбом наклеек</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Альбом наклеек</h1>
      <p id="user-status">Гость</p>
    </header>

    <main>
      <section class="controls">
        <button id="get-sticker-btn">Получить наклейку</button>
        <span class="hint">Прогресс сохраняется в браузере.</span>
      </section>

      <section>
        <h2>Моя коллекция</h2>
        <div class="album-grid" id="album"></div>
        <p>Собрано: <strong id="count">0</strong> из <span id="total">0</span></p>
      </section>

      <section>
        <h2>Каталог всех наклеек</h2>
        <div class="catalog-grid" id="catalog"></div>
      </section>
    </main>

    <footer>
      <p>Бесплатный прототип альбома наклеек</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
