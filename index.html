<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Альбом наклеек</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Альбом наклеек</h1>

  <button id="get-sticker-btn">Получить наклейку</button>

  <div class="stats">
    Собрано: <span id="collected-count">0</span> из 6
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-team="all">Все</button>
    <button class="tab-btn" data-team="team-a">Команда А</button>
    <button class="tab-btn" data-team="team-b">Команда Б</button>
  </div>

  <div id="album-grid"></div>

  <script src="script.js" defer></script>
</body>
</html>
