<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная — Наклейки</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-area">
                <h1 class="main-title">Мои наклейки</h1>
                <div class="title-meta">
                    <span class="version">v.0.2026.09.11-alpha.0</span>
                    <div class="author-line">
                        <span class="by-text">by </span>
                        <a href="https://soccerlife.ru/profileFull.php?u=RUKENT"
                           class="author-name-link"
                           target="_blank"
                           rel="noopener noreferrer">
                            RUKENT
                        </a>
                        <span class="year-text"> </span>
                    </div>
                </div>
            </div>

            <div class="header-info"></div>
        </div>
    </header>

    <main>
        <section class="section-box">
    <h2>Ввести код</h2>
    <form class="code-input-group" onsubmit="event.preventDefault(); redeemCode();">
        <input type="text" id="code-input" placeholder="Введите код (например, 2JQDL4)" maxlength="6" autocomplete="off">
        <button type="submit" id="code-button">Открыть пак</button>
    </form>
    <div id="code-message" class="code-message"></div>

    <!-- Новый блок с подсказкой -->
    <div class="code-hint-box">
        <span class="code-hint-icon">💡</span>
        <span class="code-hint-text">Где брать коды? Первый находится прямо на этой странице. Остальные нужно найти самостоятельно: описание будет добавлено позднее.</span>
    </div>
</section>

        <section class="section-box">
            <h2>Альбомы</h2>
            <div class="albums-grid" id="albums-grid"></div>
        </section>
    </main>

    <div id="pack-modal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closePackModal()">&times;</button>
            <h2>Ваш пак!</h2>
            <div class="pack-stickers" id="pack-stickers"></div>
            <button onclick="closePackModal()" class="btn-primary">Забрать наклейки</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

</body>
</html>
